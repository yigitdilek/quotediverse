<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuoteDiverse — Internal RFQ Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8FAFC;--bg2:#F1F5F9;--bg3:#E2E8F0;
  --surface:#FFFFFF;--border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --blue:#1D4ED8;--blue-h:#1E40AF;--blue-bg:#EFF6FF;--blue-b:#BFDBFE;
  --success-bg:#F0FDF4;--success:#166534;--success-b:#86EFAC;
  --warning-bg:#FFFBEB;--warning:#92400E;--warning-b:#FCD34D;
  --danger-bg:#FEF2F2;--danger:#991B1B;--danger-b:#FCA5A5;
  --info-bg:#EFF6FF;--info:#1D4ED8;--info-b:#BFDBFE;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
#root{min-height:100vh;display:flex;flex-direction:column}
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.nav-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-logo{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.nav-logo i{font-size:17px;color:#fff}
.nav-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.nav-name span{color:var(--blue)}
.nav-links{display:flex;gap:4px}
.nav-link{padding:6px 12px;border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:transparent;font-family:var(--font);transition:all .15s}
.nav-link:hover{background:var(--bg2);color:var(--text)}
.nav-link.active{background:var(--blue-bg);color:var(--blue)}
.page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;flex:1;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;box-shadow:var(--shadow)}
button{cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;border-radius:var(--radius);display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
button:hover:not(:disabled){filter:brightness(.92)}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{padding:7px 14px;background:var(--surface);border:1px solid var(--border2);color:var(--text2)}
.btn:hover:not(:disabled){background:var(--bg2);filter:none}
.btn-primary{padding:7px 14px;background:var(--blue);border:none;color:#fff}
.btn-primary:hover:not(:disabled){background:var(--blue-h);filter:none}
.btn-danger{padding:5px 9px;background:transparent;border:none;color:var(--danger)}
.btn-success{padding:7px 14px;background:#16a34a;border:none;color:#fff}
.btn-success:hover:not(:disabled){background:#15803d;filter:none}
.btn-lg{padding:10px 22px;font-size:14px}
input,select{width:100%;padding:8px 10px;font-size:13px;font-family:var(--font);border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
input::placeholder{color:var(--text3)}
.lbl{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.muted{font-size:13px;color:var(--text2)}
.mono{font-family:var(--mono)!important}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;display:inline-block}
th{text-align:left;padding:10px 12px;color:var(--text3);font-weight:500;font-size:11px;white-space:nowrap;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em;background:var(--bg2)}
td{padding:11px 12px;vertical-align:middle;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.toast{position:fixed;top:1rem;right:1rem;padding:10px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:9999;pointer-events:none;box-shadow:var(--shadow-md);animation:slideIn .2s ease;display:flex;align-items:center;gap:8px}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.01em}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px}
.stat-val{font-size:24px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.role-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em}
.role-admin{background:#fdf4ff;color:#7c3aed}
.role-management{background:#eff6ff;color:#1d4ed8}
.role-sales{background:#f0fdf4;color:#16a34a}
.tab-bar{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:3px;margin-bottom:1.5rem;width:fit-content}
.tab{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--font)}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.broker-header{background:linear-gradient(135deg,#1D4ED8 0%,#1E40AF 100%);color:#fff;padding:2rem 1.5rem;text-align:center}
.broker-header h2{font-size:20px;font-weight:600;margin-bottom:4px}
.broker-header p{font-size:13px;opacity:.8}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg3);padding:1rem}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.entered-by{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);background:var(--bg2);padding:2px 8px;border-radius:20px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.2);padding:1.75rem;width:100%;max-width:420px;animation:modalIn .15s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<!--
╔══════════════════════════════════════════════════════════════════╗
║              SUPABASE SETUP — run in SQL Editor                 ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  create table profiles (                                         ║
║    id uuid primary key references auth.users(id) on delete cascade,║
║    email text not null, full_name text not null,                 ║
║    role text not null check (role in ('admin','management','sales')),║
║    active boolean default true,                                  ║
║    created_at timestamptz default now()                          ║
║  );                                                              ║
║  create table daily_rfqs (                                       ║
║    id text primary key, rfq_date date not null unique,           ║
║    status text not null default 'open',                          ║
║    sent_at timestamptz, created_at timestamptz default now()     ║
║  );                                                              ║
║  create table rfq_lines (                                        ║
║    id text primary key,                                          ║
║    daily_rfq_id text references daily_rfqs(id) on delete cascade,║
║    mpn text not null, description text default '',               ║
║    manufacturer text default '', qty text default '',            ║
║    target_price text default '', date_needed text default '',    ║
║    entered_by_id text not null, entered_by_name text not null,   ║
║    created_at timestamptz default now()                          ║
║  );                                                              ║
║  create table brokers (                                          ║
║    id text primary key, name text not null,                      ║
║    email text not null, active boolean default true,             ║
║    created_at timestamptz default now()                          ║
║  );                                                              ║
║  create table broker_responses (                                 ║
║    id text primary key,                                          ║
║    daily_rfq_id text references daily_rfqs(id) on delete cascade,║
║    broker_name text not null, broker_email text not null,        ║
║    token text unique not null,                                   ║
║    submitted boolean default false, submitted_at timestamptz,    ║
║    lines jsonb default '[]'::jsonb,                              ║
║    created_at timestamptz default now()                          ║
║  );                                                              ║
║  alter table profiles enable row level security;                 ║
║  alter table daily_rfqs enable row level security;               ║
║  alter table rfq_lines enable row level security;                ║
║  alter table brokers enable row level security;                  ║
║  alter table broker_responses enable row level security;         ║
║  create policy "p1" on profiles for all using(true) with check(true);║
║  create policy "p2" on daily_rfqs for all using(true) with check(true);║
║  create policy "p3" on rfq_lines for all using(true) with check(true);║
║  create policy "p4" on brokers for all using(true) with check(true);║
║  create policy "p5" on broker_responses for all using(true) with check(true);║

║     ('YOUR-UUID','your@email.com','Your Name','admin');           ║

-->

<script>
'use strict';
// ═══════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════
const SUPABASE_URL = 'https://moaowzpafflkspxdveln.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vYW93enBhZmZsa3NweGR2ZWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MzIwNzEsImV4cCI6MjA5NTMwODA3MX0.6ESqOgpGy1mSq9Vzzi0oR6dXKMA7sU9SWCIKYALG1Ko';
const EJS_SVC  = 'service_pfprytb';
const EJS_TPL  = 'template_bg7mllh';
const EJS_KEY  = '1tRnsoSNUsHYb-MKz';
// ═══════════════════════════════════════════

const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
emailjs.init(EJS_KEY);

const uid   = () => Math.random().toString(36).slice(2,11) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().split('T')[0];
const rfqId = d => 'RFQ-' + d.replace(/-/g,'');
const fmtDate = d => {
  if(!d) return '—';
  const s = String(d).split('T')[0].split('-');
  return s.length===3 ? new Date(+s[0],+s[1]-1,+s[2]).toLocaleDateString() : new Date(d).toLocaleDateString();
};

// ═══════════════════════════════════════════
//  DB
// ═══════════════════════════════════════════
const q = async p => { const {data,error} = await p; if(error) throw new Error(error.message); return data; };

const db = {
  login:  (e,p) => supa.auth.signInWithPassword({email:e,password:p}),
  logout: ()    => supa.auth.signOut(),
  session:()    => supa.auth.getSession(),

  profile: async id => { const {data}=await supa.from('profiles').select('*').eq('id',id).single(); return data; },
  profiles:()   => q(supa.from('profiles').select('*').order('full_name')),
  createUser: async (email,pass,name,role) => {
    const {data,error} = await supa.auth.signUp({email,password:pass});
    if(error) throw new Error(error.message);
    await q(supa.from('profiles').insert({id:data.user.id,email,full_name:name,role,active:true}));
  },
  updateProfile: (id,u) => q(supa.from('profiles').update(u).eq('id',id)),

  todayRfq: async () => {
    const t = today();
    const {data} = await supa.from('daily_rfqs').select('*').eq('rfq_date',t).single();
    if(data) return data;
    const id = rfqId(t);
    await q(supa.from('daily_rfqs').insert({id,rfq_date:t,status:'open'}));
    return {id,rfq_date:t,status:'open',sent_at:null};
  },
  allRfqs:    ()   => q(supa.from('daily_rfqs').select('*').order('rfq_date',{ascending:false})),
  getRfq:     id   => supa.from('daily_rfqs').select('*').eq('id',id).single().then(r=>r.data),
  updateRfq:  (id,u) => q(supa.from('daily_rfqs').update(u).eq('id',id)),

  lines:     rfqId => q(supa.from('rfq_lines').select('*').eq('daily_rfq_id',rfqId).order('created_at')),
  addLine:   line  => q(supa.from('rfq_lines').insert(line)),
  deleteLine:id    => q(supa.from('rfq_lines').delete().eq('id',id)),

  brokers:       () => q(supa.from('brokers').select('*').order('name')),
  activeBrokers: () => q(supa.from('brokers').select('*').eq('active',true).order('name')),
  addBroker:    b  => q(supa.from('brokers').insert(b)),
  updateBroker: (id,u) => q(supa.from('brokers').update(u).eq('id',id)),
  deleteBroker:  id => q(supa.from('brokers').delete().eq('id',id)),

  createResponses: async (rfqId,brokers) => {
    const recs = brokers.map(b => ({id:uid(),daily_rfq_id:rfqId,broker_name:b.name,broker_email:b.email,token:uid(),submitted:false,lines:[]}));
    await q(supa.from('broker_responses').insert(recs));
    return recs;
  },
  responses:      rfqId => q(supa.from('broker_responses').select('*').eq('daily_rfq_id',rfqId)),
  responseByToken: async tok => { const {data}=await supa.from('broker_responses').select('*').eq('token',tok).single(); return data; },
  submitResponse: (id,lines) => q(supa.from('broker_responses').update({submitted:true,submitted_at:new Date().toISOString(),lines}).eq('id',id)),
  checkComplete: async rfqId=>{
    const {data}=await supa.from('broker_responses').select('submitted').eq('daily_rfq_id',rfqId);
    if(!data||!data.length) return;
    const total=data.length, done=data.filter(r=>r.submitted).length;
    if(done===total)
      await q(supa.from('daily_rfqs').update({status:'closed'}).eq('id',rfqId));
    else if(done>0)
      await q(supa.from('daily_rfqs').update({status:'partial'}).eq('id',rfqId));
  },
  partHistory: async()=>{
    const {data:responses}=await supa.from('broker_responses').select('*').eq('submitted',true);
    if(!responses?.length) return [];
    const rfqIds=[...new Set(responses.map(r=>r.daily_rfq_id))];
    const [{data:lines},{data:rfqs}]=await Promise.all([
      supa.from('rfq_lines').select('*').in('daily_rfq_id',rfqIds),
      supa.from('daily_rfqs').select('id,rfq_date').in('id',rfqIds)
    ]);
    const rows=[];
    for(const resp of responses){
      const rfqDate=rfqs?.find(r=>r.id===resp.daily_rfq_id)?.rfq_date;
      for(const ql of (resp.lines||[])){
        const line=lines?.find(l=>l.id===ql.line_id);
        if(!line) continue;
        if(!ql.unit_price) continue; // skip lines with no price entered
        rows.push({date:rfqDate,ae:line.entered_by_name,requestedQty:line.qty,requestedMpn:line.mpn,
          supplier:resp.broker_name,quotedQty:ql.quoted_qty,mpnQuoted:ql.mpn_quoted||line.mpn,
          manufacturer:ql.manufacturer,cost:ql.unit_price,currency:ql.currency||'USD',
          dateCode:ql.date_code_quoted,availability:ql.lead_time,mpq:ql.mpq,moq:ql.moq,
          comments:ql.comments,targetPrice:line.target_price});
      }
    }
    return rows.sort((a,b)=>(!a.date&&!b.date)?0:(!a.date?1:!b.date?-1:new Date(b.date)-new Date(a.date)));
  },
};

const {useState,useEffect,useCallback,createElement:h} = React;

// ═══════════════════════════════════════════
//  SHARED UI
// ═══════════════════════════════════════════
function Logo(){
  return h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
    h('div',{className:'nav-logo'},h('i',{className:'ti ti-circuit-board'})),
    h('span',{className:'nav-name'},'Quote',h('span',null,'Diverse'))
  );
}
function Toast({msg,type}){
  const [bg,c,b,ic]= type==='error'
    ? ['var(--danger-bg)','var(--danger)','var(--danger-b)','ti-circle-x']
    : ['var(--success-bg)','var(--success)','var(--success-b)','ti-circle-check'];
  return h('div',{className:'toast',style:{background:bg,color:c,border:`1px solid ${b}`}},
    h('i',{className:`ti ${ic}`}),msg);
}

function ConfirmModal({title,message,confirmLabel,confirmClass,onConfirm,onCancel}){
  return h('div',{className:'modal-backdrop',onClick:onCancel},
    h('div',{className:'modal',onClick:e=>e.stopPropagation()},
      h('div',{style:{display:'flex',alignItems:'flex-start',gap:'14px',marginBottom:'1.25rem'}},
        h('div',{style:{width:'40px',height:'40px',borderRadius:'50%',background:'var(--warning-bg)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
          h('i',{className:'ti ti-alert-triangle',style:{fontSize:'20px',color:'var(--warning)'}})),
        h('div',null,
          h('div',{style:{fontWeight:'600',fontSize:'15px',marginBottom:'4px'}},[title]),
          h('p',{style:{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}},[message])
        )
      ),
      h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'10px'}},
        h('button',{className:'btn',onClick:onCancel},'Cancel'),
        h('button',{className:confirmClass||'btn-primary',onClick:onConfirm},[confirmLabel||'Confirm'])
      )
    )
  );
}
function RoleBadge({role}){
  return h('span',{className:`role-badge role-${role}`},role);
}
function Navbar({profile,page,nav,onSignOut}){
  const isAdmin = profile?.role==='admin';
  const isMgmt  = profile?.role==='management'||isAdmin;
  const links = [
    h('button',{key:'today',className:`nav-link${page==='today'?' active':''}`,onClick:()=>nav('today')},'Today\'s RFQ')
  ];
  links.push(h('button',{key:'hist', className:`nav-link${page==='history'?' active':''}`,onClick:()=>nav('history')},'History'));
  if(isAdmin) links.push(h('button',{key:'admin',className:`nav-link${page==='admin'?' active':''}`,   onClick:()=>nav('admin')},'Admin'));
  return h('nav',{className:'nav'},
    h('div',{className:'nav-brand',onClick:()=>nav('today')},h(Logo)),
    h('div',{className:'nav-links'},...links),
    h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
      h('span',{style:{fontSize:'13px',fontWeight:'500',color:'var(--text2)'}},profile?.full_name),
      h(RoleBadge,{role:profile?.role||''}),
      h('button',{className:'btn',style:{padding:'5px 10px'},onClick:onSignOut},'Sign out')
    )
  );
}

// ═══════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════
function Login({onLogin,showToast}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [loading,setLoading]=useState(false);
  const submit = async () => {
    setLoading(true);
    const {data,error} = await db.login(email,pass);
    if(error){ showToast(error.message,'error'); setLoading(false); return; }
    const profile = await db.profile(data.user.id);
    if(!profile||!profile.active){ await db.logout(); showToast('Access denied — contact your administrator','error'); setLoading(false); return; }
    onLogin(data.user,profile);
    setLoading(false);
  };
  return h('div',{className:'login-wrap'},
    h('div',{className:'card',style:{width:'100%',maxWidth:'380px'}},
      h('div',{style:{textAlign:'center',marginBottom:'2rem'}},
        h('div',{style:{width:'48px',height:'48px',background:'var(--blue)',borderRadius:'12px',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}},
          h('i',{className:'ti ti-circuit-board',style:{fontSize:'24px',color:'#fff'}})),
        h('h1',{style:{fontSize:'20px',fontWeight:'600',marginBottom:'4px'}},'Quote',h('span',{style:{color:'var(--blue)'}},'Diverse')),
        h('p',{className:'muted',style:{fontSize:'13px'}},'Internal RFQ Portal')
      ),
      h('div',{style:{marginBottom:'14px'}},
        h('label',{className:'lbl'},'Email'),
        h('input',{type:'email',value:email,onChange:e=>setEmail(e.target.value),onKeyDown:e=>e.key==='Enter'&&submit(),placeholder:'your@company.com'})
      ),
      h('div',{style:{marginBottom:'20px'}},
        h('label',{className:'lbl'},'Password'),
        h('input',{type:'password',value:pass,onChange:e=>setPass(e.target.value),onKeyDown:e=>e.key==='Enter'&&submit(),placeholder:'••••••••'})
      ),
      h('button',{className:'btn-primary',style:{width:'100%',justifyContent:'center',padding:'10px'},onClick:submit,disabled:loading},
        loading?'Signing in...':[h('i',{key:'i',className:'ti ti-login'}),'Sign in'])
    )
  );
}

// ═══════════════════════════════════════════
//  TODAY PAGE
// ═══════════════════════════════════════════
const nL = () => ({mpn:'',description:'',manufacturer:'',qty:'',targetPrice:'',currency:'USD',dateCode:'',dateNeeded:'',comments:'',crosses:[]});
const CURRENCIES = ['USD','CAD','EUR','GBP','JPY','CNY','HKD','SGD','AUD','CHF','KRW','TWD','MXN','INR'];

function TodayPage({profile,showToast}){
  const [rfq,setRfq]       = useState(null);
  const [lines,setLines]   = useState([]);
  const [resps,setResps]   = useState([]);
  const [loading,setLoading]=useState(true);
  const [newLine,setNewLine]=useState(nL());
  const [adding,setAdding] =useState(false);
  const [sending,setSending]=useState(false);

  const [modal,setModal]=useState(null);
  const [showImport,setShowImport]=useState(false);
  const confirm=(opts)=>new Promise(resolve=>{
    setModal({...opts,onConfirm:()=>{setModal(null);resolve(true);},onCancel:()=>{setModal(null);resolve(false);}});
  });
  const isMgmt = profile.role==='management'||profile.role==='admin';
  const isAdmin= profile.role==='admin';

  const loadLines = useCallback(async rfqId => {
    try{ const l = await db.lines(rfqId); setLines(l||[]); }catch(e){ console.warn('loadLines:',e); }
  },[]);

  const load = useCallback(async()=>{
    setLoading(true);
    try{
      const rfqData = await db.todayRfq(); setRfq(rfqData);
      await loadLines(rfqData.id);
      if(rfqData.status==='sent'||rfqData.status==='closed'){
        const r = await db.responses(rfqData.id); setResps(r||[]);
      }
    }catch(e){ console.error('TodayPage load:',e); }
    setLoading(false);
  },[loadLines]);

  useEffect(()=>{ load(); },[]);

  const addLine = async()=>{
    if(!newLine.mpn.trim()){ showToast('MPN is required','error'); return; }
    setAdding(true);
    try{
      await db.addLine({id:uid(),daily_rfq_id:rfq.id,mpn:newLine.mpn.trim(),
        description:newLine.description,manufacturer:newLine.manufacturer,
        qty:newLine.qty,target_price:newLine.targetPrice,currency:newLine.currency||'USD',
        date_code:newLine.dateCode,date_needed:newLine.dateNeeded,comments:newLine.comments,
        crosses:newLine.crosses.filter(c=>c.mpn.trim()),
        entered_by_id:profile.id,entered_by_name:profile.full_name});
      setNewLine(nL());
      await loadLines(rfq.id);
    }catch(e){ showToast(e.message,'error'); }
    setAdding(false);
  };

  const delLine = async line=>{
    const ok = await confirm({title:'Delete line?',message:`Remove ${line.mpn} from today's RFQ?`,confirmLabel:'Delete',confirmClass:'btn-danger'});
    if(!ok) return;
    try{ await db.deleteLine(line.id); }catch(e){ showToast(e.message,'error'); }
  };

  const sendBrokers = async()=>{
    const ok = await confirm({
      title:'Send to brokers?',
      message:`This will email all ${lines.length} line item${lines.length!==1?'s':''} to every active broker. This cannot be undone.`,
      confirmLabel:'Yes, send now',
      confirmClass:'btn-success'
    });
    if(!ok) return;
    setSending(true);
    try{
      const brokers = await db.activeBrokers();
      if(!brokers.length){ showToast('No active brokers configured','error'); setSending(false); return; }
      const records = await db.createResponses(rfq.id,brokers);
      const base = window.location.origin+window.location.pathname;
      for(let i=0;i<records.length;i++){
        const rec=records[i];
        await emailjs.send(EJS_SVC,EJS_TPL,{
          to_email:rec.broker_email, broker_name:rec.broker_name,
          rfq_name:rfq.id, date:new Date().toLocaleDateString(),
          link:`${base}#quote/${rec.token}`
        });
        if(i<records.length-1) await new Promise(r=>setTimeout(r,400));
      }
      await db.updateRfq(rfq.id,{status:'sent',sent_at:new Date().toISOString()});
      setRfq(r=>({...r,status:'sent'}));
      setResps(records);
      showToast(`Sent to ${brokers.length} brokers successfully`);
    }catch(e){ showToast('Failed: '+e.message,'error'); }
    setSending(false);
  };

  const canDel  = l => isAdmin || l.entered_by_id===profile.id;
  const canSend = isMgmt && rfq?.status==='open' && lines.length>0;
  const statusMap = {
    open:    {bg:'var(--info-bg)',   c:'var(--info)',    l:'Open — accepting entries'},
    sent:    {bg:'var(--warning-bg)',c:'var(--warning)', l:'Sent to brokers'},
    partial: {bg:'#FEF3C7',         c:'#D97706',        l:'Quotes coming in'},
    closed:  {bg:'var(--success-bg)',c:'var(--success)', l:'All quoted'}
  };
  const st = rfq ? (statusMap[rfq.status]||statusMap.open) : null;

  const upd = (f,v) => setNewLine(p=>({...p,[f]:v}));

  if(loading) return h('div',{style:{textAlign:'center',padding:'4rem',color:'var(--text3)'}},
    h('i',{className:'ti ti-loader-2',style:{fontSize:'32px',display:'block',marginBottom:'8px'}}),'Loading...');

  return h('div',{className:'page'},
    modal&&h(ConfirmModal,modal),
    showImport&&rfq&&h(ImportModal,{rfq,profile,onClose:()=>setShowImport(false),onImport:()=>loadLines(rfq.id),showToast}),
    h('div',{className:'page-header'},
      h('div',null,
        h('h1',{className:'page-title'},`Today's RFQ — ${fmtDate(rfq?.rfq_date)}`),
        rfq&&h('div',{style:{marginTop:'4px',display:'flex',alignItems:'center',gap:'8px'}},
          h('span',{className:'mono',style:{fontSize:'12px',color:'var(--text3)'}},[rfq.id]),
          h('span',{className:'badge',style:{background:st.bg,color:st.c}},[st.l])
        )
      ),
      h('div',{style:{display:'flex',gap:'8px'}},
        h('button',{className:'btn',onClick:load},h('i',{className:'ti ti-refresh'}),'Refresh'),
        isMgmt&&rfq?.status==='open'&&h('button',{className:'btn',onClick:()=>setShowImport(true)},h('i',{className:'ti ti-file-import'}),'Import Excel'),
        canSend&&h('button',{className:'btn-success',onClick:sendBrokers,disabled:sending},
          h('i',{className:sending?'ti ti-loader-2':'ti ti-send'}),
          sending?'Sending emails...':'Send to brokers')
      )
    ),

    // Broker response status (if sent)
    rfq?.status==='sent'&&resps.length>0&&h('div',{className:'card',style:{marginBottom:'1.5rem',padding:'1rem 1.5rem'}},
      h('div',{style:{fontWeight:'600',fontSize:'13px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'6px'}},
        h('i',{className:'ti ti-mail-check',style:{color:'var(--success)'}}),'Broker responses'),
      h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}},
        ...resps.map(r=>h('span',{key:r.id,className:'badge',style:{
          background:r.submitted?'var(--success-bg)':'var(--bg3)',
          color:r.submitted?'var(--success)':'var(--text3)'
        }},r.broker_name+(r.submitted?' ✓':'')))
      )
    ),

    // Line items table
    h('div',{className:'card',style:{padding:'0',overflow:'hidden',marginBottom:'1.5rem'}},
      h('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:'800px'}},
        h('thead',null,h('tr',null,
          ...['#','MPN','Description','Manufacturer','Qty','Target $','Curr','Date Code','Date Needed','Comments','Entered By',''].map(t=>h('th',{key:t},t))
        )),
        h('tbody',null,
          lines.length===0
            ? h('tr',null,h('td',{colSpan:9,style:{textAlign:'center',color:'var(--text3)',padding:'2.5rem'}},
                'No parts entered yet. Add the first line below.'))
            : lines.map((l,i)=>h('tr',{key:l.id},
                h('td',{style:{color:'var(--text3)',fontWeight:'500'}},[i+1]),
                h('td',null,
                h('span',{className:'mono',style:{fontWeight:'600',fontSize:'13px'}},[l.mpn]),
                l.crosses&&l.crosses.filter(c=>c.mpn).map((c,i)=>h('div',{key:i,style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px',fontFamily:'var(--mono)'}},
                  h('i',{className:'ti ti-corner-down-right',style:{fontSize:'10px',marginRight:'3px'}}),c.mpn,
                  c.mfr&&h('span',{style:{color:'var(--text3)',fontWeight:'400'}},[` (${c.mfr})`])
                ))
              ),
                h('td',{style:{color:'var(--text2)'}},[l.description||'—']),
                h('td',{style:{color:'var(--text2)'}},[l.manufacturer||'—']),
                h('td',null,[l.qty||'—']),
                h('td',null,l.target_price?`$${l.target_price}`:'—'),
                h('td',null,h('span',{className:'badge',style:{background:'var(--bg2)',color:'var(--text2)',fontSize:'10px'}},[l.currency||'USD'])),
                h('td',{style:{color:'var(--text2)',fontFamily:'var(--mono)',fontSize:'12px'}},[l.date_code||'—']),
                h('td',{style:{color:'var(--text2)'}},[l.date_needed||'—']),
                h('td',{style:{color:'var(--text2)',maxWidth:'140px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[l.comments||'—']),
                h('td',null,h('span',{className:'entered-by'},h('i',{className:'ti ti-user',style:{fontSize:'11px'}}),[l.entered_by_name])),
                h('td',{style:{textAlign:'right'}},
                  canDel(l)&&rfq?.status==='open'
                    ? h('button',{className:'btn-danger',onClick:()=>delLine(l)},h('i',{className:'ti ti-trash'}))
                    : null
                )
              ))
        )
      )
    ),

    // Inline add row (only when open)
    rfq?.status==='open'&&h('div',{style:{marginTop:'1rem',display:'flex',gap:'8px',alignItems:'flex-end',flexWrap:'wrap',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'1rem'}},
      ...[
        {f:'mpn',l:'MPN *',ph:'LM358DR',cls:'mono',w:'130px'},
        {f:'description',l:'Description',ph:'Op-amp',w:'140px'},
        {f:'manufacturer',l:'Manufacturer',ph:'TI',w:'100px'},
        {f:'qty',l:'Qty',ph:'1000',w:'80px'},
        {f:'targetPrice',l:'Target $',ph:'0.25',w:'80px'},
      ].map(({f,l,ph,cls,w})=>h('div',{key:f,style:{flex:`0 0 ${w}`}},
        h('label',{className:'lbl'},[l]),
        h('input',{className:cls||'',value:newLine[f],onChange:e=>upd(f,e.target.value),placeholder:ph,onKeyDown:e=>e.key==='Enter'&&addLine(),style:{width:w}})
      )),
      h('div',{key:'curr',style:{flex:'0 0 70px'}},
        h('label',{className:'lbl'},'Curr'),
        h('select',{value:newLine.currency,onChange:e=>upd('currency',e.target.value),style:{width:'70px'}},
          ...CURRENCIES.map(c=>h('option',{key:c,value:c},c)))
      ),
      h('div',{key:'dc',style:{flex:'0 0 110px'}},
        h('label',{className:'lbl'},'Date Code'),
        h('input',{value:newLine.dateCode,onChange:e=>upd('dateCode',e.target.value),placeholder:'2024+',style:{width:'110px'}})
      ),
      h('div',{key:'dn',style:{flex:'0 0 130px'}},
        h('label',{className:'lbl'},'Date Needed'),
        h('input',{type:'date',value:newLine.dateNeeded,onChange:e=>upd('dateNeeded',e.target.value),style:{width:'130px'}})
      ),
      h('div',{key:'cm',style:{flex:'1 1 140px',minWidth:'140px'}},
        h('label',{className:'lbl'},'Comments'),
        h('input',{value:newLine.comments,onChange:e=>upd('comments',e.target.value),placeholder:'Optional',onKeyDown:e=>e.key==='Enter'&&addLine()})
      ),
      h('div',{key:'btn',style:{paddingTop:'18px'}},
        h('button',{className:'btn-primary',onClick:addLine,disabled:adding},
          h('i',{className:'ti ti-plus'}),adding?'Adding...':'Add part')
      )
    ),
    // Dynamic cross/alternative rows
    newLine.crosses.length>0&&h('div',{style:{marginTop:'8px',display:'flex',flexDirection:'column',gap:'6px'}},
      ...newLine.crosses.map((c,i)=>h('div',{key:i,style:{display:'flex',gap:'8px',alignItems:'flex-end',background:'var(--bg2)',padding:'8px 10px',borderRadius:'var(--radius)',border:'1px solid var(--border)'}},
        h('div',{style:{flex:'0 0 auto',paddingBottom:'10px'}},
          h('i',{className:'ti ti-corner-down-right',style:{color:'var(--text3)',fontSize:'14px'}})
        ),
        h('div',{style:{flex:'0 0 160px'}},
          h('label',{className:'lbl'},`Alternative MPN ${i+1}`),
          h('input',{className:'mono',style:{fontSize:'12px'},value:c.mpn,
            onChange:e=>upd('crosses',newLine.crosses.map((x,j)=>j===i?{...x,mpn:e.target.value}:x)),
            placeholder:'e.g. LM358D'})
        ),
        h('div',{style:{flex:'0 0 130px'}},
          h('label',{className:'lbl'},'Manufacturer'),
          h('input',{value:c.mfr,
            onChange:e=>upd('crosses',newLine.crosses.map((x,j)=>j===i?{...x,mfr:e.target.value}:x)),
            placeholder:'e.g. ON Semi'})
        ),
        h('button',{style:{cursor:'pointer',border:'none',background:'transparent',color:'var(--danger)',padding:'0 4px',fontSize:'18px',paddingBottom:'10px',fontFamily:'var(--font)'},
          onClick:()=>upd('crosses',newLine.crosses.filter((_,j)=>j!==i))},'×')
      ))
    ),
    h('div',{style:{marginTop:'6px'}},
      h('button',{className:'btn',style:{fontSize:'12px'},
        onClick:()=>upd('crosses',[...newLine.crosses,{mpn:'',mfr:''}])},
        h('i',{className:'ti ti-plus'}),'Add alternative / cross MPN')
    ),

    rfq?.status!=='open'&&h('div',{style:{textAlign:'center',padding:'1rem',color:'var(--text3)',fontSize:'13px'}},
      'This RFQ has been sent to brokers. No more lines can be added.')
  );
}

//  HISTORY PAGE  (tabs: RFQ History | Part History)
// ═══════════════════════════════════════════
function HistoryPage({profile,nav,setSelRfq,showToast}){
  const isAdmin=profile.role==='admin', isMgmt=profile.role==='management'||isAdmin;
  const [tab,setTab]=useState(isMgmt?'rfqs':'parts');
  return h('div',{className:'page'},
    h('div',{className:'page-header'},h('h1',{className:'page-title'},'History')),
    h('div',{className:'tab-bar'},
      isMgmt&&h('button',{key:'rfqs',className:`tab${tab==='rfqs'?' active':''}`,onClick:()=>setTab('rfqs')},'RFQ History'),
      h('button',{key:'parts',className:`tab${tab==='parts'?' active':''}`,onClick:()=>setTab('parts')},'Part History')
    ),
    tab==='rfqs'&&isMgmt&&h(RFQHistory,{nav,setSelRfq}),
    tab==='parts'&&h(PartHistory,{profile})
  );
}

function RFQHistory({nav,setSelRfq}){
  const [rfqs,setRfqs]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    let live=true;
    db.allRfqs().then(d=>{if(live){setRfqs(d||[]);setLoading(false);}}).catch(()=>{if(live)setLoading(false);});
    return()=>{live=false;};
  },[]);
  const sc=r=>{
    if(r.status==='closed')  return{bg:'var(--success-bg)',c:'var(--success)',l:'All quoted'};
    if(r.status==='partial') return{bg:'#FEF3C7',         c:'#D97706',       l:'Quotes coming in'};
    if(r.status==='sent')    return{bg:'var(--warning-bg)',c:'var(--warning)',l:'Sent'};
    return{bg:'var(--info-bg)',c:'var(--info)',l:'Open'};
  };
  const open=async rfq=>{const f=await db.getRfq(rfq.id);setSelRfq(f||rfq);nav('rfq-detail');};
  return loading?h('p',{className:'muted'},'Loading...'):
    rfqs.length===0?h('p',{className:'muted'},'No RFQs yet.'):
    h('div',{className:'card',style:{padding:'0',overflow:'hidden'}},
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,...['RFQ Reference','Date','Status','Sent At',''].map(t=>h('th',{key:t},t)))),
        h('tbody',null,...rfqs.map(rfq=>{
          const s=sc(rfq);
          return h('tr',{key:rfq.id,onClick:()=>open(rfq),style:{cursor:'pointer'}},
            h('td',null,h('span',{className:'mono',style:{fontWeight:'600'}},[rfq.id])),
            h('td',null,[fmtDate(rfq.rfq_date)]),
            h('td',null,h('span',{className:'badge',style:{background:s.bg,color:s.c}},[s.l])),
            h('td',{style:{color:'var(--text2)'}},[rfq.sent_at?fmtDate(rfq.sent_at):'—']),
            h('td',{style:{textAlign:'right'}},h('i',{className:'ti ti-chevron-right',style:{color:'var(--text3)'}}))
          );
        }))
      )
    );
}

function PartHistory({profile}){
  const isMgmt=profile.role==='management'||profile.role==='admin';
  const [rows,setRows]     =useState([]);
  const [search,setSearch] =useState('');
  const [selected,setSelected]=useState(null); // selected MPN string
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    let live=true;
    db.partHistory().then(d=>{if(live){setRows(d||[]);setLoading(false);}}).catch(()=>{if(live)setLoading(false);});
    return()=>{live=false;};
  },[]);

  // Group all rows by requestedMpn
  const byMpn={};
  for(const r of rows){
    const key=r.requestedMpn||'—';
    if(!byMpn[key]) byMpn[key]=[];
    byMpn[key].push(r);
  }
  const allMpns=Object.keys(byMpn).sort();
  const filteredMpns=allMpns.filter(m=>!search||m.toLowerCase().includes(search.toLowerCase()));

  // ── DETAIL VIEW ──────────────────────────────
  if(selected){
    const history=(byMpn[selected]||[]).sort((a,b)=>(!a.date&&!b.date)?0:(!a.date?1:!b.date?-1:new Date(b.date)-new Date(a.date)));
    const detailCols=isMgmt
      ?['Date','AE','Req Qty','Supplier','Quoted Qty','MPN Quoted','MFG','Cost','Curr','D/C Quoted','Availability','MPQ','MOQ','Comments','Target $']
      :['Date','AE','Req Qty','Quoted Qty','MPN Quoted','MFG','Cost','Curr','D/C Quoted','Availability','MPQ','MOQ','Comments','Target $'];
    return h('div',null,
      h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'1.5rem'}},
        h('button',{className:'btn',onClick:()=>setSelected(null)},h('i',{className:'ti ti-arrow-left'}),'All parts'),
        h('span',{className:'mono',style:{fontWeight:'700',fontSize:'16px'}},[selected]),
        h('span',{className:'muted',style:{fontSize:'13px'}},[`${history.length} quote${history.length!==1?'s':''}`])
      ),
      h('div',{style:{overflowX:'auto'}},
        h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px',minWidth:'900px'}},
          h('thead',null,h('tr',null,...detailCols.map(c=>h('th',{key:c,style:{fontSize:'10px'}},c)))),
          h('tbody',null,...history.map((r,i)=>h('tr',{key:i},
            h('td',null,[fmtDate(r.date)]),
            h('td',null,[r.ae||'—']),
            h('td',null,[r.requestedQty||'—']),
            isMgmt&&h('td',null,h('span',{style:{fontSize:'11px',color:'var(--text2)',fontWeight:'500'}},[r.supplier||'—'])),
            h('td',null,[r.quotedQty||'—']),
            h('td',null,h('span',{className:'mono',style:{fontSize:'12px'}},[r.mpnQuoted||'—'])),
            h('td',null,[r.manufacturer||'—']),
            h('td',null,h('div',{style:{display:'flex',alignItems:'center',gap:'5px'}},
              h('span',{style:{fontWeight:'700',color:'var(--blue)'}},[r.cost?`$${r.cost}`:'—']),
              h('span',{className:'badge',style:{background:'var(--blue-bg)',color:'var(--blue)',fontSize:'10px',padding:'1px 5px'}},[r.currency||'USD'])
            )),
            h('td',null,[r.dateCode||'—']),
            h('td',null,[r.availability||'—']),
            h('td',null,[r.mpq||'—']),
            h('td',null,[r.moq||'—']),
            h('td',{style:{maxWidth:'150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[r.comments||'—']),
            h('td',null,[r.targetPrice?`$${r.targetPrice}`:'—'])
          )))
        )
      )
    );
  }

  // ── MPN LIST VIEW ────────────────────────────
  return h('div',null,
    h('div',{style:{marginBottom:'1rem',display:'flex',alignItems:'center',gap:'12px'}},
      h('div',{style:{flex:1,maxWidth:'360px',position:'relative'}},
        h('i',{className:'ti ti-search',style:{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',color:'var(--text3)',pointerEvents:'none'}}),
        h('input',{style:{paddingLeft:'32px'},value:search,onChange:e=>setSearch(e.target.value),placeholder:'Search by MPN...'})
      ),
      !loading&&h('span',{className:'muted',style:{fontSize:'12px'}},[`${filteredMpns.length} unique MPN${filteredMpns.length!==1?'s':''}`])
    ),
    loading?h('p',{className:'muted'},'Loading...'):
    filteredMpns.length===0?h('p',{className:'muted'},search?'No results.':'No quoted parts yet.'):
    h('div',{className:'card',style:{padding:'0',overflow:'hidden'}},
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,
          ...['MPN','Last quoted','# Quotes','Best price',''].map(c=>h('th',{key:c},c))
        )),
        h('tbody',null,...filteredMpns.map(mpn=>{
          const quotes=byMpn[mpn];
          const prices=quotes.filter(q=>q.cost&&!isNaN(+q.cost)).map(q=>+q.cost);
          const best=prices.length?Math.min(...prices):null;
          const bestRow=best?quotes.find(q=>+q.cost===best):null;
          const latest=quotes.sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
          return h('tr',{key:mpn,onClick:()=>setSelected(mpn),style:{cursor:'pointer'},
            onMouseEnter:e=>e.currentTarget.style.background='var(--bg2)',
            onMouseLeave:e=>e.currentTarget.style.background=''},
            h('td',null,h('span',{className:'mono',style:{fontWeight:'700',fontSize:'13px'}},[mpn])),
            h('td',{style:{color:'var(--text2)'}},[latest?.date?fmtDate(latest.date):'—']),
            h('td',null,h('span',{className:'badge',style:{background:'var(--bg2)',color:'var(--text2)'}},[quotes.length])),
            h('td',null,best
              ? h('div',{style:{display:'flex',alignItems:'center',gap:'5px'}},
                  h('span',{style:{fontWeight:'600',color:'var(--blue)'}},[`$${(+best).toFixed(4)}`]),
                  h('span',{className:'badge',style:{background:'var(--blue-bg)',color:'var(--blue)',fontSize:'10px',padding:'1px 5px'}},[bestRow?.currency||'USD'])
                )
              : h('span',{className:'muted'},'—')
            ),
            h('td',{style:{textAlign:'right'}},h('i',{className:'ti ti-chevron-right',style:{color:'var(--text3)'}}))
          );
        }))
      )
    )
  );
}

async function parseExcelImport(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{raw:false,defval:''});
        // Flexible header mapping — case-insensitive, ignore spaces/symbols
        const norm=s=>String(s||'').toLowerCase().replace(/[\s\/\-_$#]+/g,'');
        const MAP={
          'ae':'ae','salesrep':'ae','rep':'ae','salesperson':'ae',
          mpn:'mpn',
          description:'description',
          manufacturer:'manufacturer',mfr:'manufacturer',
          qty:'qty',quantity:'qty',
          targetprice:'targetPrice',target:'targetPrice',
          currency:'currency',curr:'currency',
          datecode:'dateCode',dc:'dateCode',
          dateneeded:'dateNeeded',neededby:'dateNeeded',
          comments:'comments',notes:'comments',
          crossmpn1:'cmpn1',altmpn1:'cmpn1',
          crossmfr1:'cmfr1',altmfr1:'cmfr1',
          crossmpn2:'cmpn2',altmpn2:'cmpn2',
          crossmfr2:'cmfr2',altmfr2:'cmfr2',
          crossmpn3:'cmpn3',altmpn3:'cmpn3',
          crossmfr3:'cmfr3',altmfr3:'cmfr3',
        };
        const lines=raw
          .filter(r=>Object.values(r).some(v=>String(v).trim()))
          .map(r=>{
            const m={};
            for(const [k,v] of Object.entries(r)){
              const field=MAP[norm(k)];
              if(field) m[field]=String(v||'').trim();
            }
            return m;
          })
          .filter(m=>m.mpn)
          .map(m=>({
            mpn:m.mpn,description:m.description||'',manufacturer:m.manufacturer||'',
            qty:m.qty||'',targetPrice:m.targetPrice||'',
            currency:(m.currency||'USD').toUpperCase(),
            dateCode:m.dateCode||'',dateNeeded:m.dateNeeded||'',comments:m.comments||'',
            crosses:[
              m.cmpn1?{mpn:m.cmpn1,mfr:m.cmfr1||''}:null,
              m.cmpn2?{mpn:m.cmpn2,mfr:m.cmfr2||''}:null,
              m.cmpn3?{mpn:m.cmpn3,mfr:m.cmfr3||''}:null,
            ].filter(Boolean)
          }));
        resolve(lines);
      }catch(err){reject(err);}
    };
    reader.onerror=()=>reject(new Error('Failed to read file'));
    reader.readAsArrayBuffer(file);
  });
}

function ImportModal({rfq,profile,onClose,onImport,showToast}){
  const [preview, setPreview] = useState(null);
  const [reading, setReading] = useState(false);
  const [importing,setImporting]=useState(false);
  const fileRef = React.useRef();

  const handleFile=async f=>{
    if(!f) return;
    setReading(true); setPreview(null);
    try{ setPreview(await parseExcelImport(f)); }
    catch(e){ showToast('Could not read file: '+e.message,'error'); }
    setReading(false);
  };

  const doImport=async()=>{
    if(!preview?.length) return;
    setImporting(true);
    let ok=0,fail=0;
    for(const line of preview){
      try{
        await db.addLine({id:uid(),daily_rfq_id:rfq.id,
          mpn:line.mpn,description:line.description,manufacturer:line.manufacturer,
          qty:line.qty,target_price:line.targetPrice,currency:line.currency||'USD',
          date_code:line.dateCode,date_needed:line.dateNeeded,comments:line.comments,
          crosses:line.crosses,entered_by_id:profile.id,
          entered_by_name:line.ae||profile.full_name});
        ok++;
      }catch(e){fail++;}
    }
    setImporting(false);
    showToast(fail===0?`${ok} line${ok!==1?'s':''} imported`:`${ok} imported, ${fail} failed`,fail?'error':'success');
    onImport(); onClose();
  };

  return h('div',{className:'modal-backdrop',onClick:onClose},
    h('div',{className:'modal',style:{maxWidth:'780px',width:'100%'},onClick:e=>e.stopPropagation()},
      h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'1.25rem'}},
        h('div',null,
          h('h2',{style:{fontSize:'16px',fontWeight:'600',marginBottom:'3px'}},'Import from Excel'),
          h('p',{className:'muted',style:{fontSize:'13px'}},'Upload a filled template to add lines to today\'s RFQ')
        ),
        h('button',{className:'btn',style:{padding:'4px 10px',fontSize:'16px'},onClick:onClose},'×')
      ),

      // Step 1 — download template
      h('div',{style:{background:'var(--blue-bg)',border:'1px solid var(--blue-b)',borderRadius:'var(--radius)',padding:'12px 16px',marginBottom:'1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px',flexWrap:'wrap'}},
        h('div',null,
          h('p',{style:{fontWeight:'600',fontSize:'13px',color:'var(--blue)',marginBottom:'2px'}},'Step 1 — Download the template'),
          h('p',{style:{fontSize:'12px',color:'var(--text2)'}},'Fill in your parts and save as .xlsx — don\'t rename the columns')
        ),
        h('button',{className:'btn-primary',style:{fontSize:'12px',flexShrink:0},onClick:downloadTemplate},
          h('i',{className:'ti ti-download'}),'Download Template (.xlsx)')
      ),

      // Step 2 — upload
      h('div',{style:{marginBottom:'1.25rem'}},
        h('p',{style:{fontWeight:'600',fontSize:'13px',marginBottom:'8px'}},'Step 2 — Upload your filled file'),
        h('label',{style:{display:'block',border:`2px dashed ${preview?'var(--success-b)':'var(--border2)'}`,borderRadius:'var(--radius-lg)',padding:'1.75rem',textAlign:'center',cursor:'pointer',background:'var(--bg2)',transition:'border-color .15s'}},
          h('input',{ref:fileRef,type:'file',accept:'.xlsx,.xls,.csv',style:{display:'none'},onChange:e=>handleFile(e.target.files[0])}),
          reading
            ? h('p',{className:'muted'},'Reading file...')
            : preview
              ? h('div',null,
                  h('i',{className:'ti ti-circle-check',style:{fontSize:'28px',color:'var(--success)',display:'block',marginBottom:'6px'}}),
                  h('p',{style:{fontWeight:'500',color:'var(--success)'}},[`${preview.length} line${preview.length!==1?'s':''} ready`]),
                  h('p',{style:{fontSize:'12px',color:'var(--text3)'}},'Click to choose a different file')
                )
              : h('div',null,
                  h('i',{className:'ti ti-file-spreadsheet',style:{fontSize:'32px',color:'var(--text3)',display:'block',marginBottom:'8px'}}),
                  h('p',{style:{fontWeight:'500',color:'var(--text2)'}},'Click to choose file'),
                  h('p',{style:{fontSize:'12px',color:'var(--text3)'}},'Accepts .xlsx · .xls · .csv')
                )
        )
      ),

      // Preview table
      preview&&preview.length===0&&h('div',{style:{textAlign:'center',padding:'1rem',color:'var(--danger)',fontSize:'13px'}},
        'No valid rows found — check that the MPN column is filled and the file uses the template headers.'
      ),
      preview&&preview.length>0&&h('div',{style:{marginBottom:'1.25rem'}},
        h('p',{style:{fontWeight:'500',fontSize:'13px',marginBottom:'8px'}},`Preview — ${preview.length} line${preview.length!==1?'s':''}`),
        h('div',{style:{overflowX:'auto',maxHeight:'240px',overflowY:'auto',border:'1px solid var(--border)',borderRadius:'var(--radius)'}},
          h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px',minWidth:'680px'}},
            h('thead',null,h('tr',null,...['MPN','Description','Manufacturer','Qty','Target','Curr','Date Code','Alternatives'].map(c=>h('th',{key:c,style:{position:'sticky',top:0,background:'var(--bg2)',zIndex:1}},c)))),
            h('tbody',null,...preview.map((l,i)=>h('tr',{key:i},
              h('td',null,h('span',{className:'mono',style:{fontWeight:'700'}},[l.mpn])),
              h('td',{style:{color:'var(--text2)'}},[l.description||'—']),
              h('td',{style:{color:'var(--text2)'}},[l.manufacturer||'—']),
              h('td',null,[l.qty||'—']),
              h('td',null,[l.targetPrice?`$${l.targetPrice}`:'—']),
              h('td',null,[l.currency]),
              h('td',{style:{fontFamily:'var(--mono)',fontSize:'11px'}},[l.dateCode||'—']),
              h('td',{style:{color:'var(--text3)',fontSize:'11px'}},[l.crosses.length?l.crosses.map(c=>c.mpn).join(', '):'—'])
            )))
          )
        )
      ),

      // Actions
      h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'1rem'}},
        h('button',{className:'btn',onClick:onClose},'Cancel'),
        preview&&preview.length>0&&h('button',{className:'btn-primary',onClick:doImport,disabled:importing},
          h('i',{className:'ti ti-file-import'}),importing?'Importing...':'Import all lines')
      )
    )
  );
}

function exportExcel(rfq,lines,resps,isMgmt){
  if(typeof XLSX==='undefined'){alert('Export library not loaded');return;}
  const submitted=resps.filter(r=>r.submitted);
  const hdr=isMgmt
    ?['Date','AE','Req Qty','Req MPN','Currency','Target $','Supplier','Quoted Qty','MPN Quoted','MFG','Cost','D/C Quoted','Availability','MPQ','MOQ','Comments']
    :['Date','AE','Req Qty','Req MPN','Currency','Target $','Quoted Qty','MPN Quoted','MFG','Cost','D/C Quoted','Availability','MPQ','MOQ','Comments'];
  const rows=[hdr];
  for(const line of lines){
    for(const resp of submitted){
      const q=(resp.lines||[]).find(l=>l.line_id===line.id);
      if(!q) continue;
      const row=[rfq.rfq_date,line.entered_by_name,line.qty,line.mpn,line.currency||'USD',line.target_price,
        ...(isMgmt?[resp.broker_name]:[]),
        q.quoted_qty,q.mpn_quoted||line.mpn,q.manufacturer,q.unit_price,
        q.date_code_quoted,q.lead_time,q.mpq,q.moq,q.comments];
      rows.push(row);
    }
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:15},{wch:10},{wch:20},{wch:8},{wch:10},...(isMgmt?[{wch:20}]:[]),{wch:12},{wch:20},{wch:15},{wch:10},{wch:12},{wch:18},{wch:8},{wch:8},{wch:30}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,rfq.id||'RFQ');
  XLSX.writeFile(wb,`${rfq.id||'rfq'}-quotes.xlsx`);
}

function RFQDetail({rfq:init,profile,nav}){
  const [rfq,setRfq]          =useState(init);
  const [lines,setLines]      =useState([]);
  const [resps,setResps]      =useState([]);
  const [refreshing,setRefreshing]=useState(false);
  const isAdmin=profile.role==='admin', isMgmt=profile.role==='management'||isAdmin;

  const load=useCallback(async()=>{
    if(!rfq) return;
    setRefreshing(true);
    try{
      const [l,r]=await Promise.all([db.lines(rfq.id),db.responses(rfq.id)]);
      setLines(l||[]); setResps(r||[]);
    }catch(e){console.error(e);}
    setRefreshing(false);
  },[rfq?.id]);

  useEffect(()=>{load();},[]);

  const refresh=async()=>{const fresh=await db.getRfq(rfq.id);if(fresh)setRfq(fresh);load();};
  const submitted=resps.filter(r=>r.submitted);

  return h('div',{className:'page'},
    h('div',{className:'page-header'},
      h('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
        h('button',{className:'btn',onClick:()=>nav('history')},h('i',{className:'ti ti-arrow-left'}),'Back'),
        h('div',null,

                    const isColBest=colMin!==null&&colMin===minP;
                    return h('div',{key:resp.id,style:{background:isColBest?'var(--blue-bg)':'var(--bg2)',borderRadius:'var(--radius)',padding:'10px 12px',border:isColBest?'1.5px solid var(--blue-b)':'1px solid var(--border)'}},

                      ),

                              q.unit_price&&h('div',{style:{display:'flex',alignItems:'baseline',gap:'6px',marginBottom:'8px'}},
                                h('span',{style:{fontSize:'18px',fontWeight:'700',color:+q.unit_price===minP?'var(--blue)':'var(--text)'}},[`$${(+q.unit_price).toFixed(4)}`]),
                                h('span',{className:'badge',style:{background:+q.unit_price===minP?'var(--blue)':'var(--bg3)',color:+q.unit_price===minP?'#fff':'var(--text2)',fontSize:'10px',padding:'1px 5px'}},[q.currency||'USD'])
                              ),
                              h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}},
                                ...[['MPN',q.mpn_quoted],['Quoted Qty',q.quoted_qty],['MFG',q.manufacturer],['D/C',q.date_code_quoted],['Avail.',q.lead_time],['MPQ',q.mpq],['MOQ',q.moq],['Notes',q.comments]]
                                  .filter(([,v])=>v)
                                  .map(([k,v])=>h('tr',{key:k},
                                    h('td',{style:{color:'var(--text3)',paddingBottom:'3px',paddingRight:'8px',whiteSpace:'nowrap',verticalAlign:'top',fontWeight:'500',fontSize:'11px'}},[k]),
                                    h('td',{style:{paddingBottom:'3px',wordBreak:'break-word',color:'var(--text2)'}},[v])
                                  ))
                              )
                            ))
                          )
                        : h('div',{style:{color:'var(--text3)',fontStyle:'italic',fontSize:'12px'}},'No quote submitted')
                    );
                  })
                )
              );
            })
          )
    )
  );
}

function AdminRFQs({nav,setSelRfq,showToast}){
  const [rfqs,setRfqs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    let live=true;
    db.allRfqs().then(d=>{if(live){setRfqs(d||[]);setLoading(false);}}).catch(e=>{if(live){setErr(e.message);setLoading(false);}});
    return ()=>{live=false;};
  },[]);
  const sc=r=>{
    if(r.status==='closed')  return {bg:'var(--success-bg)',c:'var(--success)',l:'All quoted'};
    if(r.status==='partial') return {bg:'#FEF3C7',         c:'#D97706',       l:'Quotes coming in'};
    if(r.status==='sent')    return {bg:'var(--warning-bg)',c:'var(--warning)',l:'Sent'};
    return {bg:'var(--info-bg)',c:'var(--info)',l:'Open'};
  };
  const open=async rfq=>{ const f=await db.getRfq(rfq.id); setSelRfq(f||rfq); nav('rfq-detail'); };
  return loading?h('p',{className:'muted'},'Loading...'):
  err?h('p',{style:{color:'var(--danger)',fontSize:'13px',padding:'1rem'}},`Error: ${err}`):
  rfqs.length===0?h('p',{className:'muted',style:{padding:'1rem'}},'No RFQs yet.'):
  h('div',{className:'card',style:{padding:'0',overflow:'hidden'}},
    h('table',{style:{width:'100%',borderCollapse:'collapse'}},
      h('thead',null,h('tr',null,...['RFQ Reference','Date','Status','Sent At',''].map(t=>h('th',{key:t},t)))),
      h('tbody',null,...rfqs.map(rfq=>{
        const s=sc(rfq);
        return h('tr',{key:rfq.id,onClick:()=>open(rfq),style:{cursor:'pointer'}},
          h('td',null,h('span',{className:'mono',style:{fontWeight:'600'}},[rfq.id])),
          h('td',null,[fmtDate(rfq.rfq_date)]),
          h('td',null,h('span',{className:'badge',style:{background:s.bg,color:s.c}},[s.l])),
          h('td',{style:{color:'var(--text2)'}},[rfq.sent_at?fmtDate(rfq.sent_at):'—']),
          h('td',{style:{textAlign:'right'}},h('i',{className:'ti ti-chevron-right',style:{color:'var(--text3)'}}))
        );
      }))
    )
  );
}

//  BROKER FORM (unauthenticated, via link)
// ═══════════════════════════════════════════
function BrokerForm({token,showToast}){
  const [resp,setResp]    =useState(null);
  const [lines,setLines]  =useState([]);
  const [ans,setAns]      =useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]  =useState(false);

  const emptyQ=(mpn,qty,cur)=>({mpn_quoted:mpn||'',quoted_qty:qty||'',manufacturer:'',unit_price:'',currency:cur||'USD',date_code_quoted:'',lead_time:'',mpq:'',moq:'',comments:''});

  useEffect(()=>{
    if(!token) return;
    db.responseByToken(token).then(async r=>{
      if(!r){setLoading(false);return;}
      setResp(r);
      const l=await db.lines(r.daily_rfq_id);
      setLines(l||[]);
      // Pre-populate: one row per requested MPN, plus a second row if cross MPN exists
      setAns((l||[]).map(x=>{
        const qs=[emptyQ(x.mpn,x.qty,x.currency)];
        if(x.crosses&&x.crosses.length>0) x.crosses.filter(c=>c.mpn).forEach(c=>qs.push(emptyQ(c.mpn,x.qty,x.currency)));
        return {line_id:x.id, quotes:qs};
      }));
      setLoading(false);
    });
  },[token]);

  const updQ=(lid,qi,f,v)=>setAns(a=>a.map(x=>x.line_id===lid?{...x,quotes:x.quotes.map((q,i)=>i===qi?{...q,[f]:v}:q)}:x));
  const addQ =(lid)       =>setAns(a=>a.map(x=>x.line_id===lid?{...x,quotes:[...x.quotes,emptyQ()]}:x));
  const delQ =(lid,qi)    =>setAns(a=>a.map(x=>x.line_id===lid&&x.quotes.length>1?{...x,quotes:x.quotes.filter((_,i)=>i!==qi)}:x));

  const submit=async()=>{
    setSaving(true);
    try{
      // Flatten: multiple quote rows per line all go into the lines array
      const flat=ans.flatMap(a=>a.quotes.filter(q=>q.unit_price).map(q=>({...q,line_id:a.line_id})));
      await db.submitResponse(resp.id,flat);
      await db.checkComplete(resp.daily_rfq_id).catch(()=>{});
      setResp(r=>({...r,submitted:true}));
      showToast('Quote submitted successfully');
    }catch(e){showToast(e.message,'error');}
    setSaving(false);
  };

  if(loading) return h('div',{style:{textAlign:'center',padding:'4rem',color:'var(--text3)'}},'Loading your RFQ...');
  if(!resp)   return h('div',{style:{textAlign:'center',padding:'4rem'}},
    h('i',{className:'ti ti-link-off',style:{fontSize:'40px',color:'var(--text3)',display:'block',marginBottom:'12px'}}),
    h('p',{style:{fontWeight:'500'}},'Invalid or expired link'));
  if(resp.submitted) return h('div',null,
    h('div',{className:'broker-header'},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginBottom:'6px'}},
        h('div',{style:{width:'26px',height:'26px',background:'rgba(255,255,255,.2)',borderRadius:'6px',display:'flex',alignItems:'center',justifyContent:'center'}},
          h('i',{className:'ti ti-circuit-board',style:{fontSize:'13px'}})),
        h('span',{style:{fontWeight:'600'}},'QuoteDiverse')),
      h('h2',null,'Already submitted'),h('p',null,[resp.daily_rfq_id])),
    h('div',{style:{textAlign:'center',padding:'3rem',color:'var(--text2)'}},'Your quote was already received. Thank you!'));

  const qFields=[
    {f:'mpn_quoted',      l:'MPN Quoted',               ph:'Same or alternate MPN'},
    {f:'quoted_qty',      l:'Quoted Qty',      t:'number',ph:'0'},
    {f:'manufacturer',    l:'Manufacturer',               ph:'e.g. TI, ON Semi'},
    {f:'date_code_quoted',l:'Date Code',                  ph:'e.g. 2024+'},
    {f:'lead_time',       l:'Lead Time / Avail.',         ph:'In stock / 4-6 wks'},
    {f:'mpq',             l:'MPQ',             t:'number',ph:'1'},
    {f:'moq',             l:'MOQ',             t:'number',ph:'1'},
    {f:'comments',        l:'Notes',                      ph:'Optional'},
  ];

  return h('div',null,
    h('div',{className:'broker-header'},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginBottom:'6px'}},
        h('div',{style:{width:'26px',height:'26px',background:'rgba(255,255,255,.2)',borderRadius:'6px',display:'flex',alignItems:'center',justifyContent:'center'}},
          h('i',{className:'ti ti-circuit-board',style:{fontSize:'13px'}})),
        h('span',{style:{fontWeight:'600'}},'QuoteDiverse')),
      h('h2',null,[resp.daily_rfq_id]),
      h('p',null,[resp.broker_name,' · ',lines.length,' line item',lines.length!==1?'s':'',' · Quotes are confidential'])
    ),
    h('div',{style:{maxWidth:'1200px',margin:'0 auto',padding:'2rem 1.5rem'}},
      ...lines.map((line,i)=>{
        const lineAns=ans.find(x=>x.line_id===line.id);
        if(!lineAns) return null;
        return h('div',{key:line.id,className:'card',style:{marginBottom:'14px'}},
          // Line header
          h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'14px',paddingBottom:'12px',borderBottom:'1px solid var(--border)',flexWrap:'wrap'}},
            h('div',{style:{width:'24px',height:'24px',borderRadius:'6px',background:'var(--blue)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'700',flexShrink:0}},[i+1]),
            h('div',null,
              h('span',{className:'mono',style:{fontWeight:'700',fontSize:'14px'}},[line.mpn]),
              line.crosses&&line.crosses.filter(c=>c.mpn).map((c,i)=>h('div',{key:i,style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px',fontFamily:'var(--mono)'}},
                h('i',{className:'ti ti-corner-down-right',style:{fontSize:'10px',marginRight:'3px'}}),
                h('span',{style:{fontWeight:'600',color:'var(--text2)'}},[c.mpn]),
                c.mfr&&h('span',null,[` (${c.mfr})`])
              ))
            ),
            line.manufacturer&&h('span',{style:{color:'var(--text2)',fontSize:'13px'}},[line.manufacturer]),
            line.description&&h('span',{style:{color:'var(--text3)',fontSize:'13px'}},[`— ${line.description}`]),
            h('div',{style:{marginLeft:'auto',display:'flex',gap:'14px',flexWrap:'wrap'}},
              h('span',{style:{fontSize:'12px',color:'var(--text2)'}},'Req Qty: ',h('strong',{key:'q',style:{color:'var(--text)'}},[line.qty||'—'])),
              line.target_price&&h('span',{key:'t',style:{fontSize:'12px',color:'var(--text2)'}},'Target: ',h('strong',{key:'p',style:{color:'var(--text)'}},[`$${line.target_price} ${line.currency||'USD'}`])),
              line.date_code&&h('span',{key:'dc',style:{fontSize:'12px',color:'var(--text2)'}},'Req D/C: ',h('strong',{key:'d',style:{color:'var(--text)'}},[line.date_code]))
            )
          ),
          // Quote rows
          ...lineAns.quotes.map((q,qi)=>h('div',{key:qi,style:{background:'var(--bg2)',borderRadius:'var(--radius)',padding:'12px 14px',marginBottom:'8px',position:'relative'}},
            h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}},
              h('span',{style:{fontSize:'11px',fontWeight:'600',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em'}},
                qi===0?'Quote':'Additional quote'),
              lineAns.quotes.length>1&&h('button',{style:{marginLeft:'auto',cursor:'pointer',padding:'2px 8px',borderRadius:'var(--radius)',border:'none',background:'transparent',color:'var(--danger)',fontSize:'11px',fontFamily:'var(--font)'},
                onClick:()=>delQ(line.id,qi)},h('i',{className:'ti ti-x',style:{fontSize:'11px'}}),' Remove')
            ),
            h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'10px'}},
              h('div',{key:'price_row',style:{display:'flex',gap:'6px',alignItems:'flex-end'}},
                h('div',{style:{flex:1}},
                  h('label',{className:'lbl'},'Unit Price'),
                  h('input',{type:'number',value:q.unit_price,onChange:e=>updQ(line.id,qi,'unit_price',e.target.value),placeholder:'0.0000'})
                ),
                h('div',{style:{width:'72px'}},
                  h('label',{className:'lbl'},'Curr'),
                  h('select',{value:q.currency,onChange:e=>updQ(line.id,qi,'currency',e.target.value)},
                    ...CURRENCIES.map(c=>h('option',{key:c,value:c},c)))
                )
              ),
              ...qFields.map(({f,l,t,ph})=>h('div',{key:f},
                h('label',{className:'lbl'},[l]),
                h('input',{type:t||'text',value:q[f],onChange:e=>updQ(line.id,qi,f,e.target.value),placeholder:ph})
              ))
            )
          )),
          // Add quote button
          h('button',{className:'btn',style:{fontSize:'12px',marginTop:'4px'},onClick:()=>addQ(line.id)},
            h('i',{className:'ti ti-plus'}),'Add another quote for this line')
        );
      }),
      h('div',{style:{display:'flex',justifyContent:'flex-end',marginTop:'1rem',paddingBottom:'3rem'}},
        h('button',{className:'btn-primary btn-lg',onClick:submit,disabled:saving},
          h('i',{className:'ti ti-send'}),saving?'Submitting...':'Submit my quote'))
    )
  );
}


//  ERROR BOUNDARY
// ═══════════════════════════════════════════
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e.message||String(e)}; }
  componentDidCatch(e,info){ console.error('React error:',e,info); }
  render(){
    if(this.state.err) return React.createElement('div',{
      style:{margin:'2rem',padding:'1.5rem',background:'var(--danger-bg)',color:'var(--danger)',
             borderRadius:'var(--radius-lg)',border:'1px solid var(--danger-b)',fontSize:'13px'}
    }, React.createElement('strong',null,'Error: '), this.state.err,
       React.createElement('br'),
       React.createElement('span',{style:{opacity:.7}},'Check the browser console (F12) for more details.'));
    return this.props.children;
  }
}

// ═══════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════
function App(){
  const [authState,setAuth]  = useState('loading');
  const [user,setUser]       = useState(null);
  const [profile,setProfile] = useState(null);
  const [page,setPage]       = useState('today');
  const [selRfq,setSelRfq]   = useState(null);
  const [brokerTok,setBrokerTok]=useState(null);
  const [toast,setToast]     = useState(null);

  const showToast=(msg,type='success')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),4000); };

  const nav=useCallback((p,extra={})=>{
    if('rfq' in extra) setSelRfq(extra.rfq);
    setPage(p); window.scrollTo(0,0);
  },[]);

  useEffect(()=>{
    const hash=window.location.hash;
    if(hash.startsWith('#quote/')){
      setBrokerTok(hash.slice(7));
      history.replaceState(null,'',window.location.pathname);
    }
  },[]);

  useEffect(()=>{
    supa.auth.getSession().then(async({data})=>{
      if(data.session?.user){
        const prof = await db.profile(data.session.user.id);
        if(prof&&prof.active){ setUser(data.session.user); setProfile(prof); setAuth('authed'); }
        else { await supa.auth.signOut(); setAuth('unauthed'); }
      } else { setAuth('unauthed'); }
    }).catch(()=>setAuth('unauthed'));
  },[]);

  const onLogin=(u,p)=>{ setUser(u); setProfile(p); setAuth('authed'); };

  if(brokerTok) return h('div',null,
    toast&&h(Toast,toast),
    h(ErrorBoundary,null,h(BrokerForm,{token:brokerTok,showToast}))
  );

  if(authState==='loading') return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'var(--text3)'}},
    h('i',{className:'ti ti-loader-2',style:{fontSize:'32px'}})
  );

  if(authState==='unauthed') return h('div',null,
    toast&&h(Toast,toast),
    h(Login,{onLogin,showToast})
  );

  const isAdmin = profile.role==='admin';
  const isMgmt  = profile.role==='management'||isAdmin;

  const onSignOut = async()=>{ await supa.auth.signOut(); setAuth('unauthed'); setUser(null); setProfile(null); setPage('today'); };

  // Clean conditional page rendering — no && chains
  let pageContent = null;
  if     (page==='today')                  pageContent = h(TodayPage,   {profile,showToast});
  else if(page==='history')               pageContent = h(HistoryPage, {profile,nav,setSelRfq,showToast});
  else if(page==='rfq-detail' && isMgmt)   pageContent = h(RFQDetail,   {rfq:selRfq,profile,nav});
  else if(page==='admin'      && isAdmin)  pageContent = h(AdminPage,   {profile,nav,setSelRfq,showToast});
  else                                      pageContent = h(TodayPage,   {profile,showToast});

  return h('div',null,
    toast&&h(Toast,toast),
    h(Navbar,{profile,page,nav,onSignOut}),
    h(ErrorBoundary,{key:page},pageContent)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
